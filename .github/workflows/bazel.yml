name: Bazel

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'BUILD.bazel'
      - 'Sources/**'
      - 'UnitTests/**'
      - 'MODULE.bazel'
      - '.bazelversion'
      - '.github/workflows/bazel.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'BUILD.bazel'
      - 'Sources/**'
      - 'UnitTests/**'
      - 'MODULE.bazel'
      - '.bazelversion'
      - '.github/workflows/bazel.yml'
  schedule:
    # Run the first and fifteenth of every month at 5:12 UTC
    - cron:  '12 5 1,15 * *'
  # Also allow manual triggering from the github UX to revalidate things.
  workflow_dispatch:

jobs:
  bazel:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        MODE: ["dbg", "opt"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel test
        run:  |
          bazelisk test --build_tests_only -c "${{ matrix.MODE }}"  --test_output=all --verbose_failures --flaky_test_attempts=3 //...
